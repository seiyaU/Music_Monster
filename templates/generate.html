<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110d" />
  <title>Music Monster Studio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #f4f5ed; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(circle at 16% 4%, #1c5038 0, transparent 29rem), #07110d; }
    main { display: flex; width: min(100% - 3rem, 900px); min-height: 100vh; margin: auto; padding: 2rem 0; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .masthead { position: absolute; top: 2rem; display: flex; width: min(100% - 3rem, 900px); justify-content: space-between; color: #b8c5bd; font-size: .7rem; font-weight: 700; letter-spacing: .13em; }
    .masthead a { color: inherit; text-decoration: none; }
    .masthead span { color: #b7ed78; }
    .eyebrow { color: #b7ed78; font-size: .72rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: .8rem 0; font-size: clamp(2.6rem, 7vw, 5.3rem); letter-spacing: -.07em; }
    #status { max-width: 30rem; margin: 0; color: #b8c5bd; line-height: 1.6; }
    #output-image { display: none; width: min(100%, 640px); max-height: 72vh; margin: 1.2rem 0 .6rem; border: 1px solid rgba(255,255,255,.16); border-radius: 1rem; box-shadow: 0 1.5rem 4rem rgba(0,0,0,.38); object-fit: contain; }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: .6rem; }
    .action-btn { display: none; padding: .75rem 1rem; color: #ecf4df; border: 1px solid rgba(255,255,255,.18); border-radius: .5rem; background: rgba(255,255,255,.08); cursor: pointer; font: inherit; font-size: .88rem; text-decoration: none; }
    .action-btn:hover { border-color: #b7ed78; background: rgba(183,237,120,.14); }
    #save-btn { color: #07110d; border-color: #b7ed78; background: #b7ed78; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <header class="masthead"><a href="/">MUSIC MONSTER</a><span>PRIVATE STUDIO</span></header>
    <p class="eyebrow">New card session</p>
    <h1>Your card is forming.</h1>
    <p id="status">Reading the listening history…</p>
    <img id="output-image" alt="Generated Music Monster card" />
    <div class="buttons">
      <button id="save-btn" class="action-btn">Download image</button>
      <button id="again-btn" class="action-btn">Generate another card</button>
    </div>
  </main>
  <script>
    async function startGeneration() {
      try {
        const res = await fetch("/generate_api/{{ user_id }}");
        if (res.status === 401) { window.location.href = "/"; return; }
        const data = await res.json();
        if (!data.status_url) throw new Error("The generation request did not return a status URL.");
        pollStatus(data.status_url);
      } catch (error) {
        document.getElementById("status").textContent = "Generation could not be started.";
        console.error("Generation request failed:", error);
      }
    }

    async function pollStatus(url) {
      const statusText = document.getElementById("status");
      const imageEl = document.getElementById("output-image");
      const saveBtn = document.getElementById("save-btn");
      const againBtn = document.getElementById("again-btn");
      async function check() {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === "succeeded") {
          statusText.textContent = "Card complete. It has been added to the public archive.";
          imageEl.src = data.image_url;
          imageEl.style.display = "block";
          [saveBtn, againBtn].forEach(button => { button.style.display = "inline-flex"; });
          saveBtn.onclick = () => {
            const link = document.createElement("a");
            link.href = data.image_url;
            link.download = "music-monster.png";
            link.click();
          };
        } else if (data.status === "failed") {
          statusText.textContent = "Generation failed.";
        } else {
          statusText.textContent = `Working… ${data.status}`;
          setTimeout(check, 3000);
        }
      }
      check();
    }

    document.getElementById("again-btn").addEventListener("click", () => window.location.reload());
    startGeneration();
  </script>
</body>
</html>
